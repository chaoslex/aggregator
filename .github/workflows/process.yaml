name: Daily subscriptions
on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-subscriptions
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  SUBSCRIBE_CONF: subscribe/config.public.json
  ENABLE_SPECIAL_PROTOCOLS: "true"

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"
      - name: Install dependencies
        run: pip3 install -r requirements.txt
      - name: Generate and check subscriptions
        run: |
          python -u subscribe/process.py --overwrite -n 24
          python - <<'PY'
          import base64, json, re, sys, yaml
          from pathlib import Path
          root = Path("feeds")
          clash = yaml.safe_load((root / "clash.yaml").read_text(encoding="utf-8")) or {}
          proxies = clash.get("proxies") or []
          singbox = json.loads((root / "singbox.json").read_text(encoding="utf-8"))
          v2ray = base64.b64decode((root / "v2ray.txt").read_text(encoding="utf-8")).decode("utf-8", "replace")
          links = re.findall(r"(?im)^(?:vless|vmess|trojan|ss|ssr|hysteria2|hysteria|tuic|anytls)://", v2ray)
          if not proxies or not singbox.get("outbounds") or not links:
              raise SystemExit(f"Feed validation failed: clash={len(proxies)}, singbox_outbounds={len(singbox.get('outbounds', []))}, v2ray_nodes={len(links)}")
          print(f"Validated generated feeds: {len(proxies)} Clash nodes, {len(links)} V2Ray-compatible links.")
          PY
      - name: Publish feed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/clash.yaml feeds/singbox.json feeds/v2ray.txt
          if git diff --cached --quiet; then
            echo "Subscription files are unchanged."
            exit 0
          fi
          git commit -m "Refresh daily proxy subscriptions"
          gh auth setup-git
          git push origin HEAD:main
